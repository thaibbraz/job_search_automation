version: "3.8"

services:
  jobbyo-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobbyo-search
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # No longer public — Caddy (below) is the only public entry point,
      # terminating TLS and reverse-proxying here over the compose network.
      # Bound to loopback only so scripts/run_full_cycle.sh (runs on the
      # host via systemd, not in a container) can still reach it directly.
      - "127.0.0.1:8010:8000"
    volumes:
      # Personas/search-contracts are LLM-generated per user and cost money
      # to rebuild, and run_logs drive cross-run learning (dead companies,
      # dedup) — all three must survive container rebuilds/redeploys.
      - jobbyo-search-personas:/app/personas
      - jobbyo-search-contracts:/app/search_contracts
      - jobbyo-search-run-logs:/app/run_logs
    networks:
      - jobbyo-search-network

  caddy:
    image: caddy:2-alpine
    container_name: jobbyo-search-caddy
    restart: unless-stopped
    depends_on:
      - jobbyo-search
    ports:
      # Public HTTPS entry point — search-api.jobbyo.ai must resolve here
      # before Caddy can complete the ACME challenge and issue its cert.
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # ACME account + certs — must survive redeploys
      - caddy-config:/config
    networks:
      - jobbyo-search-network

networks:
  jobbyo-search-network:
    driver: bridge

volumes:
  jobbyo-search-personas:
    driver: local
  jobbyo-search-contracts:
    driver: local
  jobbyo-search-run-logs:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
